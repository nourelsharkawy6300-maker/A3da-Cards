<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قريباً - قعدة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Tajawal', sans-serif;
            background-color: #4a4d9e;
            color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .glass-box {
            background: rgba(240, 240, 240, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(240, 240, 240, 0.15);
            border-radius: 24px;
            padding: 40px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 400px;
        }
        h1 { margin: 0 0 10px 0; font-size: 2.2rem; font-weight: 900; }
        p { margin: 0; font-size: 1.1rem; color: rgba(240, 240, 240, 0.8); line-height: 1.6; }
    </style>
</head>
<body>
    <div class="glass-box">
        <h1>🚀 قريباً..</h1>
        <p>المكان ده محجوز لمفاجأة بتتحضر بمزاج، استنونا!</p>
    </div>
</body>
</html>
