<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قريباً - قعدة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; 
            font-family: 'Tajawal', sans-serif; 
            background-color: #4a4d9e; 
            color: #f0f0f0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            text-align: center;
        }
        .container {
            background: rgba(240, 240, 240, 0.1); 
            padding: 40px; 
            border-radius: 20px; 
            border: 1px solid rgba(240, 240, 240, 0.2);
        }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 قريباً..</h1>
        <p>المحتوى ده لسه بيتجهز بمزاج، استنونا!</p>
    </div>
</body>
</html>
