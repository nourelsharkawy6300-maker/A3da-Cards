<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Qaada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">

  <header class="brand">
    <h1>Qaada</h1>
  </header>

  <!-- HOME -->
  <section id="screen-home" class="panel screen active">
    <h2>Start Playing</h2>
    <p class="sub">Create a game or join one with a shared PIN.</p>
    <button id="btn-new-game" class="btn btn-primary">New Game</button>
    <button id="btn-show-join" class="btn btn-ghost">Join Game</button>
  </section>

  <!-- JOIN -->
  <section id="screen-join" class="panel screen">
    <h2>Join Game</h2>
    <p class="sub">Enter the PIN your host shared with you.</p>
    <input id="pin-input" class="pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="00">
    <div id="join-error" class="error"></div>
    <button id="btn-join" class="btn btn-primary">Join Game</button>
    <button id="btn-back-from-join" class="btn btn-ghost">Back</button>
  </section>

  <!-- HOST / REJOIN PIN DISPLAY -->
  <section id="screen-host" class="panel screen">
    <h2>Game Ready</h2>
    <p class="sub">Share this PIN with your friends, then scan your card.</p>
    <div class="pin-display">
      <span class="pin-label">Game PIN</span>
      <span id="host-pin-num" class="pin-number">00</span>
    </div>
    <button id="btn-host-continue" class="btn btn-primary">Scan My Card</button>
    <button id="btn-host-new" class="btn btn-ghost">Start a Different Game</button>
  </section>

  <!-- SCANNER -->
  <section id="screen-scanner" class="panel screen">
    <h2>Scan Your Card</h2>
    <p class="sub">Point your camera at the QR code on your physical card.</p>
    <div id="qr-reader" class="qr-reader"></div>
    <div id="scan-error" class="error"></div>
    <button id="btn-cancel-scan" class="btn btn-ghost">Cancel</button>
  </section>

  <!-- RESULT -->
  <section id="screen-result" class="panel screen">
    <div class="reveal">
      <span class="eyebrow">Card <span id="result-card-id">—</span> reveals</span>
      <img id="result-card-image" class="card-image" alt="Card">
      <div id="result-character" class="character-name">—</div>
    </div>
    <button id="btn-scan-again" class="btn btn-primary">Scan Another Card</button>
    <button id="btn-leave-game" class="btn btn-ghost">Leave Game</button>
  </section>

</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
