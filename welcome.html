<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إزاي تلعب قعدة؟</title>
    <!-- استدعاء خط البراند -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- ربط البطاقة الشخصية للأبلكيشن -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        body {
            margin: 0; font-family: 'Tajawal', sans-serif;
            background-color: #4a4d9e; color: #f0f0f0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 30px 20px; box-sizing: border-box;
            text-align: center;
        }
        .logo { max-width: 130px; margin-bottom: 15px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
        h1 { margin: 0 0 10px 0; font-weight: 900; }
        p { margin: 0 0 25px 0; color: rgba(240, 240, 240, 0.8); font-size: 16px; font-weight: 500; }
        
        .video-wrapper {
            width: 100%; max-width: 400px;
            border-radius: 16px; overflow: hidden;
            border: 2px solid rgba(240, 240, 240, 0.3);
            margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video { width: 100%; display: block; }
        
        .btn {
            padding: 16px 20px; font-size: 18px; font-weight: 900;
            border: none; border-radius: 14px; cursor: pointer;
            width: 100%; max-width: 350px; margin-bottom: 15px;
            font-family: 'Tajawal', sans-serif; transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: #f0f0f0; color: #4a4d9e; box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #f0f0f0; border: 1.5px solid rgba(240,240,240,0.4); }
        
        /* زرار التنزيل مخفي في البداية لحد ما المتصفح يتأكد إنه يقدر ينزل الأبلكيشن */
        #install-btn { display: none; }
    </style>
</head>
<body>

    <img src="logo.png" alt="لوجو قعدة" class="logo">
    <h1>إزاي تلعب قعدة؟</h1>
    <p>اتفرج على الفيديو ده عشان تفهم الليلة ماشية إزاي قبل ما تبدأ اللعب مع الشلة!</p>

    <!-- مكان فيديو الشرح -->
    <div class="video-wrapper">
        <video controls autoplay muted playsinline>
            <source src="tutorial.mp4" type="video/mp4">
            الفيديو مش شغال.
        </video>
    </div>

    <!-- زرار تنزيل اللعبة كأبلكيشن (هيظهر أوتوماتيك) -->
    <button id="install-btn" class="btn btn-primary">📲 نزل الأبلكيشن بتاع اللعبة</button>
    
    <!-- زرار الدخول العادي لو مش عايز ينزل الأبلكيشن -->
    <button onclick="window.location.href='index.html'" class="btn btn-secondary">🎮 ادخل اللوبي من المتصفح</button>

    <script>
        // 1. تسجيل المحرك (Service Worker)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log("تم تشغيل المحرك بنجاح");
            });
        }

        // 2. كود إظهار زرار التنزيل (PWA Install Prompt)
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // منع جوجل كروم إنه يطلع الإشعار المزعج لوحده
            e.preventDefault();
            deferredPrompt = e;
            // إظهار الزرار الشيك بتاعنا
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // إظهار شاشة التثبيت للمستخدم
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('العميل نزل اللعبة');
                }
                deferredPrompt = null;
                // إخفاء الزرار بعد التنزيل
                installBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
